name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allow manual runs from GitHub UI

jobs:
  build-windows:
    name: Build (Windows x86)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout mod source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Install Geode CLI ──────────────────────────────────────────────
      - name: Install Geode CLI
        uses: geode-sdk/cli/.github/actions/install@main

      # ── 3. Setup Geode SDK (official action — clones, caches, sets env) ───
      - name: Setup Geode SDK
        uses: geode-sdk/sdk/.github/actions/setup@main
        with:
          # Must match the version in mod.json
          version: "4.0.0"

      # ── 4. Configure CMake ────────────────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            -DCMAKE_BUILD_TYPE=Release `
            -DGEODE_SDK="$env:GEODE_SDK"

      # ── 5. Build ──────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --config Release --parallel

      # ── 6. Package .geode file ────────────────────────────────────────────
      - name: Package .geode
        run: |
          # Geode CLI packages the mod after cmake installs it
          geode package new build/RelWithDebInfo/ColorTriggerGen.dll `
            --binary build/RelWithDebInfo/ColorTriggerGen.dll `
            --output ColorTriggerGen.geode `
            --resources resources

      # ── 7. Upload artifact ────────────────────────────────────────────────
      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorTriggerGen-windows
          path: "*.geode"
          if-no-files-found: error
          retention-days: 30

  # ── Optional: create a GitHub Release on version tag ─────────────────────
  release:
    name: Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ColorTriggerGen-windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.geode"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
