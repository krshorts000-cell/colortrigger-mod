name: Build Geode Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed for release job

jobs:
  # ─── Main build using the official geode-sdk/build-geode-mod action ──────
  build:
    name: Build (Windows x86)
    runs-on: ubuntu-latest   # the action handles cross-compilation internally

    steps:
      - uses: actions/checkout@v4

      # Official Geode composite action: installs CLI + SDK, runs cmake, packages .geode
      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Geode SDK version matching mod.json "geode" field
          sdk: "4.0.0"
          # Target platform
          target: win
          # Extra cmake flags if needed
          # extra-cmake-args: ""

      # Upload the .geode artifact produced by the action
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: ColorTriggerGen-win
          path: "*.geode"
          if-no-files-found: error
          retention-days: 30

  # ─── Auto-release on version tag push ────────────────────────────────────
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ColorTriggerGen-win

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.geode"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
